# Throwaway stack for `pnpm test:integration`: a pinned Kuma 2.x and a Postgres with the slice of
# Dokploy's schema the sync reads. Ports bind to 127.0.0.1 on ephemeral host ports only.
name: dokploy-uptime-kuma-sync_integration

services:
  kuma:
    image: louislam/uptime-kuma:2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    ports:
      - '127.0.0.1::3001'
    healthcheck:
      test: ['CMD-SHELL', 'extra/healthcheck']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: dokploy
    ports:
      - '127.0.0.1::5432'
    volumes:
      - ./test/integration/dokploy-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dokploy -d dokploy']
      interval: 1s
      timeout: 3s
      retries: 30
