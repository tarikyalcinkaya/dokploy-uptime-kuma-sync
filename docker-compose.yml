# Deploy this as a Docker Compose service inside Dokploy itself, on the Dokploy server.
# That way Postgres stays private: dokploy-uptime-kuma-sync reaches it over dokploy-network as
# `dokploy-postgres:5432` and the database never needs to be exposed.
# The image is built by CI and pinned by digest; the server only pulls it (see README, "Deploying to the server").
services:
  dokploy-uptime-kuma-sync:
    image: ghcr.io/tarikyalcinkaya/dokploy-uptime-kuma-sync:v0.2.0@sha256:79e766bba889f5269d3e0687b65f2e6ad89e5f217cdc3a402983ccd9366ffc9a
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUN_MODE: loop
    env_file:
      - .env
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
